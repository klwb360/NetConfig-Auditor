# H3C Comware demonstration, synthetic addresses and credentials
sysname LAB-H3C
stp mode mstp
stp enable
vlan 10
 name OFFICE
#
interface GigabitEthernet1/0/1
 port link-type trunk
 stp edged-port enable
 stp bpdu-filter enable
 port trunk pvid vlan 1
 port trunk permit vlan all
 undo shutdown
#
interface Vlan-interface10
 ip address 10.10.10.1 255.255.255.0
 packet-filter 3000 inbound
#
interface GigabitEthernet1/0/2
 ip address 192.0.2.1 255.255.255.0
 nat outbound 2000 address-group 1
 nat server protocol tcp global 192.0.2.2 8080 inside 10.10.10.10 80
#
nat address-group 1 192.0.2.10 192.0.2.20
acl basic 2000
 rule 5 permit source 10.10.10.0 0.0.0.255
#
acl advanced 3000
 rule 5 permit ip
 rule 10 deny tcp destination-port eq 23
#
ip route-static 0.0.0.0 0.0.0.0 192.0.2.254
ssh server enable
telnet server enable
http server enable
snmp-agent community read simple DEMO_ONLY_NOT_A_SECRET
user-interface vty 0 4
 authentication-mode scheme
 protocol inbound ssh
 acl 2000 inbound
 idle-timeout 10 0
#
ospf 1 router-id 10.255.0.1
 area 0
  network 10.10.10.0 0.0.0.255
#
