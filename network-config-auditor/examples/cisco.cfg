hostname LAB-CISCO
version 15.2
vlan 10
 name OFFICE
!
interface GigabitEthernet0/1
 description Office uplink
 switchport mode trunk
 switchport trunk native vlan 1
 switchport trunk allowed vlan all
 no shutdown
!
interface GigabitEthernet0/2
 ip address 192.0.2.1 255.255.255.0
 ip access-group WAN-IN in
 ip nat outside
!
interface GigabitEthernet0/3
 ip address 10.10.10.1 255.255.255.0
 ip nat inside
!
ip access-list extended WAN-IN
 10 permit ip any any
 20 deny tcp any any eq 23
!
access-list 10 permit 10.10.10.0 0.0.0.255
ip nat inside source list 10 interface GigabitEthernet0/2 overload
ip nat inside source static tcp 10.10.10.10 22 192.0.2.2 2222
ip route 0.0.0.0 0.0.0.0 192.0.2.254
router ospf 1
 network 10.10.10.0 0.0.0.255 area 0
!
ip http server
ip ssh authentication-retries 10
snmp-server community DEMO_ONLY_NOT_A_SECRET RO
username demo password 7 DEMO_ONLY_NOT_A_SECRET
line vty 0 4
 transport input ssh
 login local
 access-class 10 in
 exec-timeout 10 0
!
line vty 5 15
 transport input telnet ssh
 no login
 exec-timeout 0 0
!
