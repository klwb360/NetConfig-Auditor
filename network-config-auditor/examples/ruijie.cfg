! Synthetic demonstration only; no production configuration or credentials.
version S29_RGOS 11.4(1)B79
hostname LAB-RUIJIE
no spanning-tree
vlan range 1,10,20,100-101
!
interface GigabitEthernet 0/1
 description Demo access port
 switchport access vlan 100
 switchport protected
!
interface GigabitEthernet 0/2
 description Demo second access port
 switchport access vlan 100
 switchport protected
!
interface GigabitEthernet 0/3
 description Demo uplink
 switchport mode trunk
 switchport trunk native vlan 20
 switchport trunk allowed vlan 10,20,100-101
!
interface VLAN 20
 ip address 192.0.2.1 255.255.255.0
!
ip ssh version 1
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
!
line vty 5 15
 login local
 transport input ssh
 exec-timeout 10 0
!
