!Software Version V200R019C10
sysname LAB-HUAWEI
vlan batch 10 20 to 22
#
interface GigabitEthernet0/0/1
 description Office trunk
 port link-type trunk
 port trunk pvid vlan 1
 port trunk allow-pass vlan 10 20 to 22
 undo shutdown
#
interface GigabitEthernet0/0/2
 ip address 192.0.2.1 255.255.255.0
 traffic-filter inbound acl 3000
 nat outbound 2000
 nat server protocol tcp global 192.0.2.2 8443 inside 10.10.10.10 443
#
interface Vlanif10
 ip address 10.10.10.1 255.255.255.0
#
acl number 2000
 rule 5 permit source 10.10.10.0 0.0.0.255
#
acl number 3000
 rule 5 permit ip source any destination any
 rule 10 deny tcp destination-port eq 23
#
ip route-static 0.0.0.0 0.0.0.0 192.0.2.254
stelnet server enable
telnet server enable
http server enable
snmp-agent community read simple DEMO_ONLY_NOT_A_SECRET
user-interface vty 0 4
 authentication-mode aaa
 protocol inbound telnet ssh
 acl 2000 inbound
 idle-timeout 0 0
#
