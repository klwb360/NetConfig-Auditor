[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "network-config-auditor"
version = "0.2.2"
description = "Offline evidence-based Cisco/Huawei/H3C network configuration auditor"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}
dependencies = []

[project.scripts]
netaudit = "netaudit.cli:main"

[tool.setuptools.packages.find]
include = ["netaudit*"]

[tool.setuptools.package-data]
netaudit = ["web/*.html", "web/*.js", "web/*.css", "data/*.json", "data/*.txt"]
