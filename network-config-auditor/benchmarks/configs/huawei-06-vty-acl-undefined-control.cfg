sysname huawei-06-vty-acl-undefined-control
interface GigabitEthernet0/0/1
 description Campus-uplink
 undo shutdown
 ip address 10.6.0.1 255.255.255.0
#
acl number 2001
 rule 5 permit source 10.0.0.0 0.255.255.255
