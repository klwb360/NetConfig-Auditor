hostname cisco-17-acl-shadow-risk
interface GigabitEthernet0/1
 description Campus-uplink
 no shutdown
 no switchport
 ip address 10.17.0.1 255.255.255.0
!
ip access-list extended CAMPUS
 10 deny tcp any any eq 23
 20 permit tcp any any eq 23
!
interface GigabitEthernet0/1
 ip access-group CAMPUS in
!
