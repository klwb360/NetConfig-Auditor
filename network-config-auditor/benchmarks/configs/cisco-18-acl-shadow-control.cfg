hostname cisco-18-acl-shadow-control
interface GigabitEthernet0/1
 description Campus-uplink
 no shutdown
 no switchport
 ip address 10.18.0.1 255.255.255.0
!
ip access-list extended CAMPUS
 10 permit tcp any any established
 20 deny tcp any any eq 23
!
interface GigabitEthernet0/1
 ip access-group CAMPUS in
!
