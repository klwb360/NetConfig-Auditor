name: NetAudit release curation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/netaudit-release-curation.yml
      - .github/release-curation.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netaudit-release
  cancel-in-progress: false

jobs:
  curate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out fixed evidence and curation code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"
      - name: Test publication and curation guards
        run: python -m unittest discover -s tools/tests -v
      - name: Verify all three versions, update descriptions, then organize uploads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURATION_REPORT: release-curation-verification.json
        run: python tools/curate_releases.py
      - name: Preserve the actual organization result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NetAudit-release-organization-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-curation-verification.json
          if-no-files-found: ignore
          retention-days: 90
