name: NetAudit Windows portable

on:
  pull_request:
    paths:
      - network-config-auditor/**
      - tools/clean_windows_runtime.ps1
      - .github/workflows/netaudit-windows.yml
  push:
    branches: [main]
    paths:
      - network-config-auditor/**
      - .github/workflows/netaudit-windows.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netaudit-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-portable:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: network-config-auditor
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up the fixed Windows x64 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"
          architecture: x64
      - name: Run source regression tests
        run: |
          python -m pip install -e ".[test]"
          python -m coverage run -m pytest -q
          python -m coverage report --fail-under=80
          python tools/benchmark_acceptance.py --out reports/acceptance.json
      - name: Verify vendor syntax classification
        run: node tests/vendor_syntax_cases.js
      - name: Build and verify source, onedir, then onefile
        run: python tools/build_windows.py
      - name: Upload verified portable packages and checksums
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NetAudit-windows-x64-${{ github.sha }}
          path: network-config-auditor/dist/windows/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Upload acceptance diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NetAudit-windows-diagnostics-${{ github.sha }}
          path: network-config-auditor/build/windows/verification/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Record the authenticated download entry
        run: |
          "Download: ${{ steps.upload.outputs.artifact-url }}" >> $env:GITHUB_STEP_SUMMARY
          "Artifact ID: ${{ steps.upload.outputs.artifact-id }}" >> $env:GITHUB_STEP_SUMMARY
          "GitHub artifact digest: ${{ steps.upload.outputs.artifact-digest }}" >> $env:GITHUB_STEP_SUMMARY

  clean-runtime:
    needs: windows-portable
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: NetAudit-windows-x64-${{ github.sha }}
          path: ${{ runner.temp }}/netaudit-packages
      - name: Verify frozen packages after removing runner CPython installs
        shell: pwsh
        run: ./tools/clean_windows_runtime.ps1 -PackageDirectory "$env:RUNNER_TEMP/netaudit-packages" -ReportPath "$env:RUNNER_TEMP/clean-runtime.json"
      - name: Preserve clean runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clean-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/clean-runtime.json
          if-no-files-found: warn
