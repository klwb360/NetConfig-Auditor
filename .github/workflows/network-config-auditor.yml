name: Network Config Auditor
on:
  push:
    paths:
      - 'network-config-auditor/**'
      - 'tools/**'
      - '.github/workflows/network-config-auditor.yml'
  pull_request:
    paths:
      - 'network-config-auditor/**'
      - 'tools/**'
      - '.github/workflows/network-config-auditor.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    defaults:
      run:
        working-directory: network-config-auditor
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - name: Application tests and coverage gate
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report --fail-under=80
          python -m coverage json -o reports/coverage.json
      - name: Independent 50-configuration acceptance
        run: python tools/benchmark_acceptance.py --out reports/acceptance.json
      - name: Publication and immutable legacy-record guards
        working-directory: .
        run: python -m unittest discover -s tools/tests -v
      - name: Verify vendor syntax classification
        run: node tests/vendor_syntax_cases.js
      - run: python tools/reproduce_upstream.py
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acceptance-python-${{ matrix.python }}-${{ github.sha }}
          path: network-config-auditor/reports/*.json
          if-no-files-found: warn
