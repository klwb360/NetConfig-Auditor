name: Network Config Auditor
on:
  push:
    paths:
      - 'network-config-auditor/**'
      - '.github/workflows/network-config-auditor.yml'
  pull_request:
    paths:
      - 'network-config-auditor/**'
      - '.github/workflows/network-config-auditor.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    defaults:
      run:
        working-directory: network-config-auditor
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Verify vendor syntax classification
        run: node tests/vendor_syntax_cases.js
      - run: python tools/reproduce_upstream.py
      - run: python -m pip wheel . --no-deps --wheel-dir dist
