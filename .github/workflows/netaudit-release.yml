name: NetConfig Auditor release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag matching the verified manifest; blank uses release-source.json
        required: true
      run_id:
        description: Successful Windows workflow run ID; blank uses release-source.json
        required: true
      source_commit:
        description: Full source commit of that Windows build; blank uses release-source.json
        required: true

permissions:
  contents: read

concurrency:
  group: netaudit-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the publisher
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"
      - name: Test delivery, archive, publication and curation guards
        run: python -m unittest discover -s tools/tests -v
      - name: Verify nine original files and permanent records, then publish three runnable assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_RUN_ID: ${{ inputs.run_id }}
          RELEASE_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: python tools/publish_release.py
